```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | LinguaHelp</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #10172a;
      color: white;
      font-family: Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 35px;
      background: #1b2740;
      border-radius: 18px;
    }
    h1 { text-align: center; }
    p { text-align: center; color: #b8c4d9; }
    input {
      width: 100%;
      padding: 14px;
      margin: 9px 0;
      border: 1px solid #42516d;
      border-radius: 8px;
      background: #10172a;
      color: white;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 8px;
      background: #65e6c4;
      color: #10172a;
      font-weight: bold;
      cursor: pointer;
    }
    a { color: #65e6c4; }
    .links { text-align: center; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌍 Join LinguaHelp</h1>
    <p>Create your free account</p>

    <form id="registerForm">
      <input type="text" id="name" placeholder="Full name" required>
      <input type="email" id="email" placeholder="Email address" required>
      <input type="password" id="password"
        placeholder="Create password" minlength="8" required>
      <button type="submit">Create Account</button>
    </form>

    <p id="message"></p>

    <div class="links">

      <a href="index.html">Back to Home</a>
    </div>
  </div>
</body>
</html>
